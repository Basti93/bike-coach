# Optional sync server. Reachable only within your own tailnet, without Funnel.
# Variables via Compose interpolation from ./.env (chmod 600). No env_file, so that api does not see the Tailscale key.
name: bike-coach

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_PATH: /data/bike-coach.db
      SYNC_TOKEN: ${SYNC_TOKEN:?SYNC_TOKEN in .env setzen}
    ports:
      - "127.0.0.1:7002:7002"
    volumes:
      - data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7002/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  tailscale:
    # Own Tailscale node, no host port.
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    logging: *default-logging
    hostname: bike-coach
    environment:
      TS_HOSTNAME: bike-coach
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    depends_on:
      - api
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  data:
  tsstate:
