# Optionaler Sync-Server. Nur im eigenen Tailnet erreichbar, ohne Funnel.
# Variablen per Compose-Interpolation aus ./.env (chmod 600). Kein env_file, damit api den Tailscale-Key nicht sieht.
name: bike-coach

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_PATH: /data/bike-coach.db
      SYNC_TOKEN: ${SYNC_TOKEN:?SYNC_TOKEN in .env setzen}
    ports:
      - "127.0.0.1:7002:7002"
    volumes:
      - data:/data
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  tailscale:
    # Eigener Tailscale-Knoten, kein Host-Port.
    image: tailscale/tailscale:v1.76.1
    restart: unless-stopped
    logging: *default-logging
    hostname: bike-coach
    environment:
      TS_HOSTNAME: bike-coach
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    depends_on:
      - api
    mem_limit: 128m

volumes:
  data:
  tsstate:
